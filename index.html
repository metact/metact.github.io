<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="analytics-endpoint" content="https://bilateria.org/app/estadistica/metac/track.php">
  <meta name="analytics-stats-url" content="https://bilateria.org/app/estadistica/metac/admin-stats.php">
  <meta name="analytics-site-id" content="metac">
  <title>Metac — Recursos metodológicos para el aula</title>
  <link rel="icon" type="image/svg+xml" href="metac-logo.svg">
  <script>(function(){var p=localStorage.getItem('metac_theme')||'auto';var d=p==='dark'||(p==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.setAttribute('data-theme',d?'dark':'light');document.documentElement.setAttribute('data-theme-pref',p);})();</script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 8px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.05);
      --shadow-lg: 0 12px 24px rgba(0,0,0,.12), 0 4px 8px rgba(0,0,0,.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shadow);
    }
    .header-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -.02em;
      flex-shrink: 0;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-img {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    .logo-text {
      display: flex;
      flex-direction: column;
    }
    .logo small {
      display: block;
      font-size: .65rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: .02em;
      margin-top: 2px;
    }
    .search-wrap {
      flex: 1;
      min-width: 180px;
      position: relative;
    }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      flex-shrink: 0;
    }
    #searchInput {
      width: 100%;
      padding: 8px 38px 8px 36px;
      border: 1px solid var(--border);
      border-radius: 50px;
      font-size: .875rem;
      background: var(--bg);
      transition: border-color .15s, box-shadow .15s;
    }
    #searchInput:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
    }
    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: .95rem;
      line-height: 1;
      transition: background .12s, color .12s;
    }
    .search-clear:hover { background: #e2e8f0; color: var(--text); }
    .search-clear.visible { display: inline-flex; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .lang-group {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .lang-btn {
      padding: 6px 13px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: .8rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: background .12s, color .12s;
      letter-spacing: .04em;
    }
    .lang-btn.active { background: var(--primary); color: #fff; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 500;
      color: var(--text);
      transition: background .12s, border-color .12s, box-shadow .12s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg); box-shadow: var(--shadow); }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); justify-content: center; }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn-danger { color: #dc2626; border-color: #fca5a5; justify-content: center; }
    .btn-danger:hover { background: #fee2e2; }
    .assistant-link {
      text-decoration: none;
      max-width: 320px;
    }
    .assistant-link-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,.96);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45);
    }
    .assistant-link img {
      width: 14px;
      height: 14px;
      object-fit: contain;
      flex-shrink: 0;
    }
    .assistant-link span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .fav-badge {
      background: #f59e0b;
      color: #fff;
      border-radius: 50%;
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem;
      font-weight: 800;
    }

    /* ── Filter tabs ── */
    .block-nav,
    .field-nav {
      background: var(--bg);
      border-bottom: 0;
      padding: 0;
      overflow-x: visible;
    }
    .block-nav { padding-top: 8px; padding-bottom: 4px; }
    .field-nav { padding-bottom: 0; }
    .field-nav-inner,
    .block-nav-inner {
      width: min(calc(100% - 40px), 1360px);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 2px 4px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .block-nav-inner {
      padding: 6px 10px;
      background: #fff7ed;
      border-color: #fed7aa;
    }
    .field-nav-inner {
      padding: 4px 10px;
      background: var(--surface);
    }
    .field-tab,
    .block-tab {
      padding: 8px 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
      border-bottom: 0;
      border-radius: 999px;
      transition: color .12s, border-color .12s;
      flex-shrink: 0;
    }
    .block-tab {
      font-size: .84rem;
      font-weight: 650;
      color: #9a3412;
    }
    .field-tab:hover { color: var(--text); }
    .block-tab:hover {
      color: #7c2d12;
      background: #ffedd5;
    }
    .field-tab.active {
      color: var(--primary);
      font-weight: 700;
      background: #eff6ff;
      box-shadow: inset 0 0 0 1px #bfdbfe;
    }
    .block-tab.active {
      color: #fff;
      font-weight: 800;
      background: #ea580c;
      box-shadow: inset 0 0 0 1px #c2410c;
    }

    /* ── Shared banner ── */
    .shared-banner {
      background: #eff6ff;
      border-bottom: 1px solid #bfdbfe;
      padding: 9px 20px;
      display: none;
    }
    .shared-banner.visible { display: block; }
    .shared-banner-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .shared-banner-inner span { font-size: .875rem; color: #1d4ed8; flex: 1; }

    /* ── Main ── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 20px;
    }
    .results-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .results-info {
      font-size: .8rem;
      color: var(--text-muted);
    }
    .per-page-wrap {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-left: 10px;
    }
    .per-page-wrap select {
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: .8rem;
      color: var(--text);
      cursor: pointer;
    }
    .pagination-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-top: 20px;
      flex-wrap: wrap;
    }
    .page-btn {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: .82rem;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background .12s, border-color .12s;
      font-weight: 500;
    }
    .page-btn:hover:not(:disabled) { background: var(--bg); border-color: #cbd5e1; }
    .page-btn:disabled { opacity: .35; cursor: default; }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 700; }
    .page-ellipsis { font-size: .82rem; color: var(--text-muted); padding: 0 4px; line-height: 34px; }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: box-shadow .15s, transform .1s, border-color .15s;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); border-color: #cbd5e1; }
    .card.is-fav { border-color: #fcd34d; }
    .card.is-shared { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .card.is-selected {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15,118,110,.18);
      background: #f0fdfa;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .card-name {
      font-size: .95rem;
      font-weight: 700;
      line-height: 1.3;
      flex: 1;
      display: inline-block;
      padding: 8px 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
      border: 1px solid #dbe7ff;
      color: #0f172a;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.8);
    }
    .fav-star {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 1px;
      line-height: 1;
      filter: grayscale(1) opacity(0.28);
      transition: filter .12s, transform .12s;
      flex-shrink: 0;
    }
    .fav-star:hover { filter: grayscale(0) opacity(0.7); transform: scale(1.2); }
    .fav-star.active { filter: none; }

    .card-prog-icon {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .7rem; color: var(--primary); opacity: .65;
      flex-shrink: 0; margin-top: 1px;
    }
    .card:hover .card-prog-icon { opacity: 1; }

    .card-fields { display: flex; flex-wrap: wrap; gap: 5px; }
    .card-block { display: flex; flex-wrap: wrap; gap: 5px; }
    .field-badge {
      font-size: .68rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 50px;
      border: 1px solid transparent;
      letter-spacing: .02em;
    }
    .block-badge {
      font-size: .68rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 50px;
      border: 1px solid #fed7aa;
      background: #fff7ed;
      color: #9a3412;
      letter-spacing: .02em;
    }
    .card-summary { font-size: .78rem; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .card-summary.expanded { -webkit-line-clamp: unset; overflow: visible; }
    .summary-toggle { background: none; border: none; padding: 0; font-size: .72rem; color: var(--primary); cursor: pointer; font-weight: 600; margin-top: 2px; display: none; }
    .summary-toggle:hover { text-decoration: underline; }
    .card-select {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: transparent;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 800;
      flex-shrink: 0;
      transition: background .12s, border-color .12s, color .12s;
    }
    .card-select.active {
      background: #0f766e;
      border-color: #0f766e;
      color: #fff;
    }
    .selection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      z-index: 350;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-lg);
    }
    .selection-bar-info {
      font-size: .82rem;
      color: var(--text-muted);
    }
    .selection-bar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ── Empty / Loading ── */
    .state-box {
      text-align: center;
      padding: 70px 20px;
      color: var(--text-muted);
    }
    .state-box .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .state-box h3 { font-size: 1rem; color: var(--text); margin-bottom: 5px; }
    .state-box p { font-size: .85rem; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Modal ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(3px);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s;
    }
    .overlay.open { opacity: 1; pointer-events: all; }

    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transform: translateY(12px) scale(.97);
      transition: transform .18s;
    }
    .overlay.open .modal { transform: none; }

    .modal-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .modal-title { font-size: 1.2rem; font-weight: 800; flex: 1; line-height: 1.3; }
    .modal-head-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
      transition: background .12s;
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn.fav-active { color: #f59e0b; border-color: #fcd34d; background: #fffbeb; }
    #modalFavBtn:not(.fav-active) { filter: grayscale(1) opacity(0.35); }

    .modal-meta {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .modal-tags-row { font-size: .88rem; color: var(--text-muted); font-style: italic; line-height: 1.6; }

    /* Program links */
    .modal-programs {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .modal-programs-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-right: 2px;
    }
    .program-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      border-radius: 50px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .12s, border-color .12s;
    }
    .program-btn:hover { background: #dbeafe; border-color: #93c5fd; }
    .program-btn svg { flex-shrink: 0; }

    .modal-body {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      font-size: .88rem;
      line-height: 1.75;
    }
    .modal-body h4 {
      font-size: .9rem;
      font-weight: 700;
      color: var(--primary);
      margin: 16px 0 6px;
    }
    .modal-body h4:first-child { margin-top: 0; }
    .modal-body p { margin-bottom: 6px; }
    .modal-body ol { margin: 6px 0 10px 18px; display: flex; flex-direction: column; gap: 4px; }
    .desc-table { border-collapse: collapse; width: 100%; margin: 10px 0 14px; font-size: .82rem; }
    .desc-table th, .desc-table td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; }
    .desc-table th { background: #eff6ff; color: var(--primary); font-weight: 700; }
    .desc-table tr:nth-child(even) td { background: var(--bg); }
    .section-label { font-weight: 700; color: var(--primary); }

    .modal-foot {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* ── Favorites panel ── */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.25);
      z-index: 400;
      opacity: 0;
      pointer-events: none;
      transition: opacity .18s;
    }
    .panel-overlay.open { opacity: 1; pointer-events: all; }

    .side-panel {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 360px;
      max-width: 100vw;
      background: var(--surface);
      box-shadow: -4px 0 24px rgba(0,0,0,.12);
      z-index: 410;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .22s ease;
    }
    .panel-overlay.open .side-panel { transform: none; }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head h2 { font-size: 1rem; font-weight: 800; }
    .panel-body { flex: 1; overflow-y: auto; padding: 14px; }

    .fav-item {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: background .12s;
    }
    .fav-item:hover { background: var(--bg); }
    .fav-item-name { flex: 1; font-size: .875rem; font-weight: 600; }
    .fav-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: .9rem;
      padding: 2px 5px; border-radius: 4px;
      transition: color .12s, background .12s;
    }
    .fav-remove:hover { color: #dc2626; background: #fee2e2; }

    .panel-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #1e293b;
      color: #fff;
      padding: 9px 20px;
      border-radius: 50px;
      font-size: .82rem;
      z-index: 1000;
      transition: transform .25s ease;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: var(--shadow-md);
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Category panel ── */
    .panel-new-cat {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1.5px dashed var(--border);
      border-radius: var(--radius-sm);
      background: transparent;
      cursor: pointer;
      font-size: .82rem;
      color: var(--text-muted);
      transition: border-color .12s, color .12s, background .12s;
      margin-bottom: 10px;
    }
    .panel-new-cat:hover { border-color: var(--primary); color: var(--primary); background: #eff6ff; }

    .cat-section {
      margin-bottom: 8px;

// ─── CSV PARSER ──────────────────────────────────────────────────────────────

function parseCSV(raw) {
  const rows = [];
  let row = [], cell = '', inQ = false;
  for (let i = 0; i < raw.length; i++) {
    const c = raw[i];
    if (c === '"') {
      if (inQ && raw[i + 1] === '"') { cell += '"'; i++; }
      else inQ = !inQ;
    } else if (c === ',' && !inQ) {
      row.push(cell); cell = '';
    } else if (c === '\n' && !inQ) {
      row.push(cell); rows.push(row); row = []; cell = '';
    } else if (c !== '\r') {
      cell += c;
    }
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function toObjects(raw, lang = DEFAULT_LANG) {
  const rows = parseCSV(raw);
  if (rows.length < 2) return [];
  const headers = rows[0].map(h => h.trim().toLowerCase());
  const hasId = headers.includes('id');
  const col = {
    id:      colIndex(headers, ['id'], hasId ? 0 : -1),
    name:    colIndex(headers, ['technique'], hasId ? 1 : 0),
    desc:    colIndex(headers, ['description'], hasId ? 2 : 1),
    tags:    colIndex(headers, ['tags'], hasId ? 3 : 2),
    fields:  colIndex(headers, ['fields'], hasId ? 4 : 3),
    program: colIndex(headers, ['program'], hasId ? 5 : 4),
    summary: colIndex(headers, ['abstract', 'resumen', 'resum'], hasId ? 6 : 5),
    block:   colIndex(headers, ['block', 'bloque', 'bloc'], hasId ? 7 : 6),
  };

  return rows.slice(1).filter(r => r[col.name] && r[col.name].trim()).map((r, rowIndex) => {
    const rawFields = (r[col.fields] || '').split(',').map(s => s.trim()).filter(Boolean);
    const block = normalizeBlock(r[col.block] || '', lang);
    const fields = [], fieldIds = [], inlineProgs = [];
    rawFields.forEach(f => {
      if (f.includes('|')) {
        inlineProgs.push(f);
        return;
      }
      const field = normalizeField(f, lang);
      if (field.id && !fieldIds.includes(field.id)) {
        fieldIds.push(field.id);
        fields.push(field.label);
      }
    });
    return {
      id:       normalizeId(col.id >= 0 ? r[col.id] : '') || `row_${rowIndex + 1}`,
      name:     (r[col.name] || '').trim(),
      desc:     (r[col.desc] || '').trim(),
      tags:     (r[col.tags] || '').split(',').map(s => s.trim()).filter(Boolean),
      block:    block.label,
      blockId:  block.id,
      fields,
      fieldIds,
      programs: [...parsePrograms(r[col.program] || ''), ...parsePrograms(inlineProgs.join(';'))],
      summary:  (r[col.summary] || '').trim(),
    };
  });
}

function colIndex(headers, names, fallback) {
  const idx = names.map(n => headers.indexOf(n)).find(i => i !== -1);
  return idx === undefined ? fallback : idx;
}

function normalizeId(value) {
  return value === null || value === undefined ? '' : String(value).trim();
}

function buildIdMap(data) {
  const map = new Map();
  data.forEach((item, idx) => {
    if (!item.id) return;
    if (map.has(item.id)) console.warn(`Duplicate methodological resource ID: ${item.id}`);
    else map.set(item.id, { item, idx });
  });
  return map;
}

function rowById(itemId, lang = S.lang) {
  return (S.byId[lang] || new Map()).get(normalizeId(itemId)) || null;
}

function itemById(itemId, lang = S.lang) {
  const row = rowById(itemId, lang);
  return row ? row.item : null;
}

function uniqueIds(ids) {
  const seen = new Set();
  const out = [];
  ids.forEach(value => {
    const id = normalizeId(value);
    if (id && !seen.has(id)) {
      seen.add(id);
      out.push(id);
    }
  });
  return out;
}

function validItemIds(ids, lang = S.lang) {
  const map = S.byId[lang] || new Map();
  return uniqueIds(ids).filter(id => map.has(id));
}

function sortedItemIds(ids, lang = S.lang) {
  const map = S.byId[lang] || new Map();
  return validItemIds(ids, lang).sort((a, b) => map.get(a).idx - map.get(b).idx);
}

function refsToItemIds(refs, lang = S.lang) {
  const data = S.data[lang] || [];
  const map = S.byId[lang] || new Map();
  return uniqueIds(refs).map(ref => {
    if (map.has(ref)) return ref;
    if (/^\d+$/.test(ref)) {
      const legacyItem = data[Number(ref)];
      return legacyItem ? legacyItem.id : '';
    }
    return '';
  }).filter(id => id && map.has(id));
}

function normalizeStoredRefs(lang = S.lang) {
  if (!S.data[lang]) return;

  const favs = refsToItemIds([...S.favorites], lang);
  const favsChanged = favs.length !== S.favorites.size || favs.some(id => !S.favorites.has(id));
  S.favorites = new Set(favs);
  if (favsChanged) saveFavs();

  let catsChanged = false;
  S.categories = S.categories.map(cat => {
    const rawIds = Array.isArray(cat.itemIds) ? cat.itemIds : [];
    const itemIds = refsToItemIds(rawIds, lang);
    if (itemIds.length !== rawIds.length || itemIds.some((id, idx) => id !== rawIds[idx])) catsChanged = true;
    return { id: cat.id, name: cat.name, itemIds };
  });
  if (catsChanged) saveCats();
}

// Parse "Label1|url1 ; Label2|url2"
function parsePrograms(raw) {
  return raw.split(';').map(s => s.trim()).filter(Boolean).map(entry => {
    const pipe = entry.indexOf('|');
    if (pipe === -1) return null;
    return { label: entry.slice(0, pipe).trim(), url: entry.slice(pipe + 1).trim() };
  }).filter(Boolean);
}

// ─── FIELD UTILS ─────────────────────────────────────────────────────────────

function canonicalKey(value) {
  return String(value || '')
    .trim()
    .toLowerCase()
    .replace(/[’`´]/g, "'")
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, ' ');
}

function taxonomyLabel(def, lang = S.lang) {
  return def.labels[lang] || def.labels[DEFAULT_LANG] || def.id;
}

function taxonomyDescription(def, lang = S.lang) {
  return (def.descriptions && (def.descriptions[lang] || def.descriptions[DEFAULT_LANG])) || '';
}

function taxonomyHint(label, description) {
  return description || label;
}

function buildTaxonomyIndex(defs) {
  const map = new Map();
  defs.forEach(def => {
    Object.values(def.labels).forEach(label => map.set(canonicalKey(label), def));
    Object.values(def.aliases || {}).flat().forEach(alias => map.set(canonicalKey(alias), def));
  });
  return map;
}

const BLOCK_INDEX = buildTaxonomyIndex(BLOCK_DEFS);
const FIELD_INDEX = buildTaxonomyIndex(FIELD_DEFS);

function customTaxonomyId(prefix, value) {
  const key = canonicalKey(value);
  return key ? `${prefix}:${key}` : '';
}

function normalizeBlock(value, lang = S.lang) {
  const raw = String(value || '').trim();
  if (!raw) return { id: '', label: '' };
  const def = BLOCK_INDEX.get(canonicalKey(raw));
  return def
    ? { id: def.id, label: taxonomyLabel(def, lang) }
    : { id: customTaxonomyId('block', raw), label: raw };
}

function normalizeField(value, lang = S.lang) {
  const raw = String(value || '').trim();
  if (!raw) return { id: '', label: '' };
  const def = FIELD_INDEX.get(canonicalKey(raw));
  return def
    ? { id: def.id, label: taxonomyLabel(def, lang) }
    : { id: customTaxonomyId('field', raw), label: raw };
}

const colorCache = {};
function fieldColor(name) {
  if (colorCache[name]) return colorCache[name];
  const n = canonicalKey(name);
  for (let i = 0; i < FIELD_MAP.length; i++) {
    if (FIELD_MAP[i].some(kw => n.includes(kw))) {
      return (colorCache[name] = COLORS[i]);
    }
  }
  // hash fallback
  const h = [...name].reduce((a, c) => (a * 31 + c.charCodeAt(0)) & 0xffff, 0);
  return (colorCache[name] = COLORS[h % COLORS.length]);
}

function badgeHTML(field) {
  const c = fieldColor(field);
  return `<span class="field-badge" style="background:${c.bg};color:${c.text};border-color:${c.border}">${esc(field)}</span>`;
}

function blockBadgeHTML(block) {
  return block ? `<span class="block-badge">${esc(block)}</span>` : '';
}

function knownOrder(defs, id) {
  const idx = defs.findIndex(def => def.id === id);
  return idx === -1 ? defs.length : idx;
}

function taxonomyDescriptionById(defs, id, lang = S.lang) {
  const def = defs.find(item => item.id === id);
  return def ? taxonomyDescription(def, lang) : '';
}

function blockDescription(id, lang = S.lang) {
  return taxonomyDescriptionById(BLOCK_DEFS, id, lang);
}

function fieldDescription(id, lang = S.lang) {
  return taxonomyDescriptionById(FIELD_DEFS, id, lang);
}

function blockScopedData() {
  const data = S.data[S.lang] || [];
  return S.block ? data.filter(item => item.blockId === S.block) : data;
}

function allBlocks() {
  const map = new Map();
  (S.data[S.lang] || []).forEach(item => {
    if (item.blockId && !map.has(item.blockId)) map.set(item.blockId, {
      id: item.blockId,
      label: item.block,
      description: blockDescription(item.blockId),
    });
  });
  return [...map.values()]
    .sort((a, b) => knownOrder(BLOCK_DEFS, a.id) - knownOrder(BLOCK_DEFS, b.id) || a.label.localeCompare(b.label));
}

function allFields() {
  const map = new Map();
  blockScopedData().forEach(item => {
    item.fieldIds.forEach((id, idx) => {
      if (id && !map.has(id)) map.set(id, {
        id,
        label: item.fields[idx],
        description: fieldDescription(id),
      });
    });
  });
  return [...map.values()]
    .sort((a, b) => knownOrder(FIELD_DEFS, a.id) - knownOrder(FIELD_DEFS, b.id) || a.label.localeCompare(b.label));
}

function syncActiveFilters() {
  if (S.block && !allBlocks().some(block => block.id === S.block)) {
    S.block = null;
    S.field = null;
  }
  if (S.field && !allFields().some(field => field.id === S.field)) S.field = null;
}

// ─── DESCRIPTION FORMATTER ───────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function inlineFormat(raw) {
  return esc(raw).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

function formatDesc(text) {
  const lines = text.split('\n');
  let html = '', list = [], tableLines = [];

  const flush = () => {
    if (!list.length) return;
    html += '<ol>' + list.map(li => `<li>${li}</li>`).join('') + '</ol>';
    list = [];
  };

  const flushTable = () => {
    if (!tableLines.length) return;
    let head = true, tableHtml = '<table class="desc-table"><thead>';
    tableLines.forEach(line => {
      const clean = line.replace(/\|h\s*$/, '').trim();
      if (/^\|[\s\-:|\s]+\|$/.test(clean)) return; // separator row
      const cells = clean.split('|').slice(1, -1);  // drop first/last empty
      const tag = head ? 'th' : 'td';
      if (head) {
        tableHtml += '<tr>' + cells.map(c => `<th>${inlineFormat(c.trim())}</th>`).join('') + '</tr></thead><tbody>';
        head = false;
      } else {
        tableHtml += '<tr>' + cells.map(c => `<td>${inlineFormat(c.trim())}</td>`).join('') + '</tr>';
      }
    });
    tableHtml += '</tbody></table>';
    html += tableHtml;
    tableLines = [];
  };

  for (let idx = 0; idx < lines.length; idx++) {
    const raw = lines[idx];
    const line = raw.trim();

    if (line.startsWith('|')) {
      flush();
      tableLines.push(line);
      continue;
    } else {
      flushTable();
    }

    if (!line) {
      if (list.length) {
        let next = idx + 1;
        while (next < lines.length && !lines[next].trim()) next++;
        if (next < lines.length && /^\d+\.\s+/.test(lines[next].trim())) continue;
      }
      flush();
      continue;
    }

    if (line.startsWith('## ')) {
      flush();
      html += `<h4>${esc(line.slice(3))}</h4>`;
      continue;
    }

    const num = line.match(/^\d+\.\s+([\s\S]+)/);
    if (num) { list.push(inlineFormat(num[1])); continue; }

    flush();

    // Section header: starts with 2+ uppercase letters then colon
    const sec = line.match(/^([A-ZÁÉÍÓÚÀÈÌÒÙÜÑÇ][A-ZÁÉÍÓÚÀÈÌÒÙÜÑÇ\s\(\)\/,']+:)\s*(.*)/);
    if (sec) {
      html += `<p><span class="section-label">${esc(sec[1])}</span>${sec[2] ? ' ' + inlineFormat(sec[2]) : ''}</p>`;
    } else {
      html += `<p>${inlineFormat(line)}</p>`;
    }
  }

  flush();
  flushTable();
  return html;
}

// ─── DATA FETCH ──────────────────────────────────────────────────────────────

async function loadLang(lang) {
  lang = resolveLang(lang);
  if (S.data[lang]) return;
  let raw;
  try {
    const res = await fetch(CSV[lang]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = await res.text();
  } catch {
    const res = await fetch(LOCAL_CSV[lang]);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    raw = await res.text();
  }
  S.data[lang] = toObjects(raw, lang);
  S.byId[lang] = buildIdMap(S.data[lang]);
  normalizeStoredRefs(lang);
}

// ─── SHARING & CLIPBOARD ─────────────────────────────────────────────────────

function shareURL(itemIds, name = null) {
  const u = new URL(location.href.split('?')[0]);
  u.searchParams.set('t', sortedItemIds(itemIds).join(','));
  u.searchParams.set('lang', S.lang);
  if (name) u.searchParams.set('tname', name);
  return u.toString();
}

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea');
    t.value = text; t.style.cssText = 'position:fixed;opacity:0';
    document.body.append(t); t.select();
    document.execCommand('copy'); t.remove();
  }
  toast(i('copied'));
}

const LS_CATS = 'metec_cats_v1';

    }));

const LS_LANG = 'metec_lang_v1';
function saveLang() { localStorage.setItem(LS_LANG, S.lang); }
function isSupportedLang(lang) { return LANGS.includes(lang); }
function resolveLang(lang) { return isSupportedLang(lang) ? lang : DEFAULT_LANG; }
function loadLangPref() {
  const saved = localStorage.getItem(LS_LANG);
  if (isSupportedLang(saved)) { S.lang = saved; return; }
  const browserLang = String((navigator.languages && navigator.languages[0]) || navigator.language || '').toLowerCase();

  else if (browserLang.startsWith('es')) S.lang = 'es';

// ─── RENDER: CARDS ───────────────────────────────────────────────────────────

function filteredData() {
  const data = S.data[S.lang] || [];

  let indexed = S.shared
    ? refsToItemIds(S.shared).map(id => {
      const row = rowById(id);
      return row ? { item: row.item, id, idx: row.idx } : null;
    }).filter(Boolean)
    : data.map((item, idx) => ({ item, id: item.id, idx }));

  if (S.block)
    indexed = indexed.filter(({ item }) => item.blockId === S.block);

  if (S.field)
    indexed = indexed.filter(({ item }) => item.fieldIds.includes(S.field));

  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const q = norm(S.search.trim());
  if (q) indexed = indexed.filter(({ item }) =>
    norm(item.id).includes(q) ||
    norm(item.name).includes(q) ||
    norm(item.desc).includes(q) ||
    norm(item.summary).includes(q) ||
    norm(item.block).includes(q) ||
    item.tags.some(t => norm(t).includes(q)) ||
    item.fields.some(f => norm(f).includes(q)) ||
    item.programs.some(p =>
      norm(p.label).includes(q) ||
      norm(p.url).includes(q)
    )
  );

  return indexed;
}

function clearSelection(render = true) {
  S.selected.clear();
  S.selectMode = false;
  if (render) {
    applyI18N();
    renderCards();
  }
}

function toggleSelectMode() {
  S.selectMode = !S.selectMode;
  if (!S.selectMode) S.selected.clear();
  applyI18N();
  renderCards();
}

function toggleCardSelection(itemId) {
  if (S.selected.has(itemId)) S.selected.delete(itemId);
  else S.selected.add(itemId);
  renderCards();
}

function selectVisibleCards() {
  pagedRows(filteredData()).forEach(({ id }) => S.selected.add(id));
  renderCards();
}

function pagedRows(rows) {
  if (!S.perPage) return rows;
  const start = S.page * S.perPage;
  return rows.slice(start, start + S.perPage);
}

function totalPages(total) {
  return S.perPage ? Math.max(1, Math.ceil(total / S.perPage)) : 1;
}

function renderCards() {
  const main = document.getElementById('main');
  const allRows = filteredData();
  const total = allRows.length;
  main.style.paddingBottom = S.selectMode ? '110px' : '';

  if (!total) {
    main.innerHTML = `<div class="state-box">
      <div class="icon">🔍</div>
      <h3>${i('noResults')}</h3><p>${i('noResHint')}</p>
    </div>`;
    return;
  }

  // Clamp page to valid range
  const pages = totalPages(total);
  if (S.page >= pages) S.page = pages - 1;

  const rows = pagedRows(allRows);

  main.innerHTML = '';

  // Results bar: count + per-page selector
  const bar = document.createElement('div');
  bar.className = 'results-bar';
  bar.innerHTML = `
    <p class="results-info">
      ${total} ${i('techniques')}
      <span class="per-page-wrap">
        <label for="perPageSelect">${i('perPage')}</label>
        <select id="perPageSelect">
          <option value="10"  ${S.perPage===10  ?'selected':''}>10</option>
          <option value="25"  ${S.perPage===25  ?'selected':''}>25</option>
          <option value="50"  ${S.perPage===50  ?'selected':''}>50</option>
          <option value="0"   ${S.perPage===0   ?'selected':''}>${i('pageAll')}</option>
        </select>
      </span>
    </p>
  `;
  bar.querySelector('#perPageSelect').onchange = e => {
    S.perPage = Number(e.target.value);
    S.page = 0;
    renderCards();
  };
  main.appendChild(bar);

  if (S.selectMode) {
    const selBar = document.createElement('div');
    selBar.className = 'selection-bar';
    selBar.innerHTML = `
      <div class="selection-bar-info">${S.selected.size} ${i('selectedCount')}</div>
      <div class="selection-bar-actions">
        <button class="btn" id="selectVisibleBtn">✓ ${i('selectVisible')}</button>
        <button class="btn btn-primary" id="shareSelectedBtn">🔗 ${i('shareSel')}</button>
        <button class="btn" id="cancelSelectionBtn">✕ ${i('selectOff')}</button>
      </div>
    `;
    main.appendChild(selBar);
    selBar.querySelector('#selectVisibleBtn').onclick = () => selectVisibleCards();
    selBar.querySelector('#shareSelectedBtn').onclick = () => {
      if (!S.selected.size) return;
      copy(shareURL([...S.selected]));
    };
    selBar.querySelector('#cancelSelectionBtn').onclick = () => clearSelection();
  }

  const grid = document.createElement('div');
  grid.className = 'cards-grid';

  rows.forEach(({ item, id }) => {
    const fav = S.favorites.has(id);
    const shared = S.shared && S.shared.includes(id);
    const selected = S.selected.has(id);
    const card = document.createElement('div');
    card.className = 'card' + (fav ? ' is-fav' : '') + (shared ? ' is-shared' : '') + (selected ? ' is-selected' : '');
    const progIcon = item.programs.length
      ? `<span class="card-prog-icon" title="${item.programs.map(p => esc(p.label)).join(', ')}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>`
      : '';
    card.innerHTML = `
      <div class="card-top">
        <div class="card-name">${esc(item.name)}</div>
        ${progIcon}
        <span class="card-select ${selected ? 'active' : ''}" style="display:${S.selectMode ? 'inline-flex' : 'none'}">✓</span>
        <div class="cat-picker-wrap card-fav-wrap">
          <button class="fav-star ${fav ? 'active' : ''}" data-id="${esc(id)}">⭐</button>
        </div>
      </div>
      ${item.block ? `<div class="card-block">${blockBadgeHTML(item.block)}</div>` : ''}
      <div class="card-fields">${item.fields.map(badgeHTML).join('')}</div>
      <div class="card-summary">${esc(item.summary)}</div>
      <button class="summary-toggle">${i('more')}</button>
    `;
    card.querySelector('.fav-star').onclick = e => { e.stopPropagation(); toggleFav(id, e.currentTarget); };
    card.querySelector('.summary-toggle').onclick = e => {
      e.stopPropagation();
      const summary = card.querySelector('.card-summary');
      const expanded = summary.classList.toggle('expanded');
      e.currentTarget.textContent = expanded ? i('less') : i('more');
    };
    card.onclick = () => { if (S.selectMode) toggleCardSelection(id); else openModal(id); };
    grid.appendChild(card);
  });

  main.appendChild(grid);

  // Show "Ver más" only on actually truncated summaries
  grid.querySelectorAll('.card-summary').forEach(el => {
    if (el.scrollHeight > el.clientHeight + 2) {
      el.nextElementSibling.style.display = 'block';
    }
  });

  // Pagination controls (only when perPage > 0 and more than one page)
  if (S.perPage && pages > 1) {
    main.appendChild(buildPagination(pages));
  }
}

function buildPagination(pages) {
  const wrap = document.createElement('div');
  wrap.className = 'pagination-bar';
  const p = S.page;

  const btn = (label, title, disabled, active, onclick) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.innerHTML = label;
    b.title = title;
    b.disabled = disabled;
    if (!disabled) b.onclick = onclick;
    return b;
  };

  const ellipsis = () => {
    const s = document.createElement('span');
    s.className = 'page-ellipsis';
    s.textContent = '…';
    return s;
  };

  wrap.appendChild(btn('«', i('pageFirst'), p === 0, false, () => { S.page = 0; renderCards(); window.scrollTo(0,0); }));
  wrap.appendChild(btn('‹', i('pagePrev'),  p === 0, false, () => { S.page--; renderCards(); window.scrollTo(0,0); }));

  // Page number buttons: always show first, last, current ±2, with ellipsis
  const show = new Set([0, pages - 1]);
  for (let n = Math.max(0, p - 2); n <= Math.min(pages - 1, p + 2); n++) show.add(n);
  const nums = [...show].sort((a, b) => a - b);

  let prev = -1;
  nums.forEach(n => {
    if (prev !== -1 && n - prev > 1) wrap.appendChild(ellipsis());
    wrap.appendChild(btn(n + 1, '', false, n === p, () => { S.page = n; renderCards(); window.scrollTo(0,0); }));
    prev = n;
  });

  wrap.appendChild(btn('›', i('pageNext'), p === pages - 1, false, () => { S.page++; renderCards(); window.scrollTo(0,0); }));
  wrap.appendChild(btn('»', i('pageLast'), p === pages - 1, false, () => { S.page = pages - 1; renderCards(); window.scrollTo(0,0); }));

  return wrap;
}

// ─── FAVORITES ───────────────────────────────────────────────────────────────

function toggleFav(itemId, anchorEl = null) {
  itemId = normalizeId(itemId);
  if (!itemById(itemId)) return;
  const adding = !S.favorites.has(itemId);
  const fromCardStar = anchorEl && anchorEl.classList.contains('fav-star');
  const fromModalFav = anchorEl && anchorEl.id === 'modalFavBtn';

  if (!adding) {
    S.favorites.delete(itemId);
    S.categories.forEach(c => { c.itemIds = c.itemIds.filter(id => id !== itemId); });
    saveCats();
    toast(i('favRemoved'));
  } else {
    S.favorites.add(itemId);
    toast(i('favAdded'));
  }
  saveFavs();
  updateFavBadge();
  renderCards();
  if (S.modal !== null)
    document.getElementById('modalFavBtn').classList.toggle('fav-active', S.favorites.has(S.modal));

  if (adding && anchorEl) {
    let pickerAnchor = anchorEl;
    if (fromCardStar) {
      pickerAnchor = [...document.querySelectorAll('.fav-star')].find(btn => btn.dataset.id === itemId) || anchorEl;
    } else if (fromModalFav) {
      pickerAnchor = document.getElementById('modalFavBtn') || anchorEl;
    }
    openCatPicker(itemId, pickerAnchor);
  }
}

function updateFavBadge() {
  const n = S.favorites.size;
  const el = document.getElementById('favBadge');
  el.textContent = n;
  el.style.display = n ? 'flex' : 'none';
}

// ─── FAVORITES PANEL ─────────────────────────────────────────────────────────

function openPanel() { renderPanel(); document.getElementById('panelOverlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closePanel() { document.getElementById('panelOverlay').classList.remove('open'); document.body.style.overflow = ''; }

let activePicker = null;

function catUID() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function createCategory(name) {
  const cat = { id: catUID(), name, itemIds: [] };
  S.categories.push(cat);
  saveCats();
  return cat;
}

function deleteCategory(id) {
  S.categories = S.categories.filter(c => c.id !== id);
  saveCats();
}

function addToCategory(itemId, catId) {
  itemId = normalizeId(itemId);
  const cat = S.categories.find(c => c.id === catId);
  if (cat && itemById(itemId) && !cat.itemIds.includes(itemId)) { cat.itemIds.push(itemId); saveCats(); }
}

function removeFromCategory(itemId, catId) {
  itemId = normalizeId(itemId);
  const cat = S.categories.find(c => c.id === catId);
  if (cat) { cat.itemIds = cat.itemIds.filter(id => id !== itemId); saveCats(); }
}

function assignToCategory(itemId, catId = null) {
  itemId = normalizeId(itemId);
  S.categories.forEach(cat => {
    cat.itemIds = cat.itemIds.filter(id => id !== itemId);
  });
  if (catId) {
    const target = S.categories.find(cat => cat.id === catId);
    if (target && itemById(itemId) && !target.itemIds.includes(itemId)) target.itemIds.push(itemId);
  }
  saveCats();
}

function promptNewCategory(addItemId = null) {
  const name = prompt(i('catPrompt'));
  if (!name || !name.trim()) return;
  const cat = createCategory(name.trim());
  if (addItemId !== null) addToCategory(addItemId, cat.id);
  renderPanel();
}

function openCatPicker(itemId, anchorEl) {
  itemId = normalizeId(itemId);
  if (activePicker) { activePicker.remove(); activePicker = null; }
  const picker = document.createElement('div');
  picker.className = 'cat-picker';
  picker.onclick = e => e.stopPropagation();
  activePicker = picker;

  const title = document.createElement('div');
  title.className = 'cat-picker-title';
  title.textContent = i('addToCat');
  picker.appendChild(title);

  const currentCat = S.categories.find(cat => cat.itemIds.includes(itemId));

  const noneRow = document.createElement('div');
  noneRow.className = 'cat-picker-row';
  const noneRadio = document.createElement('input');
  noneRadio.type = 'radio';
  noneRadio.name = `cat-${itemId}`;
  noneRadio.checked = !currentCat;
  noneRadio.onclick = e => e.stopPropagation();
  const noneLbl = document.createElement('span');
  noneLbl.textContent = i('uncategorized');
  noneRow.onclick = e => {
    e.stopPropagation();
    assignToCategory(itemId, null);
    picker.remove();
    activePicker = null;
    renderPanel();
  };
  noneRow.appendChild(noneRadio);
  noneRow.appendChild(noneLbl);
  picker.appendChild(noneRow);

  if (!S.categories.length) {
    const none = document.createElement('div');
    none.className = 'cat-picker-row';
    none.style.color = 'var(--text-muted)';
    none.textContent = i('noCatsYet');
    picker.appendChild(none);
  } else {
    S.categories.forEach(cat => {
      const row = document.createElement('div');
      row.className = 'cat-picker-row';
      const cb = document.createElement('input');
      cb.type = 'radio';
      cb.name = `cat-${itemId}`;
      cb.checked = currentCat ? currentCat.id === cat.id : false;
      cb.onclick = e => e.stopPropagation();
      const lbl = document.createElement('span');
      lbl.textContent = cat.name;
      row.onclick = e => {
        e.stopPropagation();
        assignToCategory(itemId, cat.id);
        picker.remove();
        activePicker = null;
        renderPanel();
      };
      row.appendChild(cb);
      row.appendChild(lbl);
      picker.appendChild(row);
    });
  }

  const addRow = document.createElement('div');
  addRow.className = 'cat-picker-add';
  addRow.innerHTML = '<span>+</span> ' + i('newCat');
  addRow.onclick = e => { e.stopPropagation(); picker.remove(); activePicker = null; promptNewCategory(itemId); };
  picker.appendChild(addRow);

  const wrap = anchorEl.closest('.cat-picker-wrap');
  if (wrap) {
    wrap.appendChild(picker);
  } else {
    picker.style.position = 'fixed';
    picker.style.right = 'auto';
    picker.style.top = '0';
    picker.style.left = '0';
    document.body.appendChild(picker);

    const rect = anchorEl.getBoundingClientRect();
    const margin = 8;
    const maxLeft = Math.max(margin, window.innerWidth - picker.offsetWidth - margin);
    const left = Math.min(Math.max(margin, rect.right - picker.offsetWidth), maxLeft);
    const maxTop = Math.max(margin, window.innerHeight - picker.offsetHeight - margin);
    const preferredTop = rect.bottom + 6;
    const fallbackTop = rect.top - picker.offsetHeight - 6;
    const top = preferredTop <= maxTop ? preferredTop : Math.max(margin, fallbackTop);
    picker.style.left = `${left}px`;
    picker.style.top = `${top}px`;
  }

  setTimeout(() => {
    const close = e => {
      if (!picker.contains(e.target) && !anchorEl.contains(e.target)) {
        picker.remove();
        activePicker = null;
        document.removeEventListener('click', close);
      }
    };
    document.addEventListener('click', close);
  }, 0);
}

function buildFavItem(itemId, catId) {
  itemId = normalizeId(itemId);
  const item = itemById(itemId);
  if (!item) return null;
  const el = document.createElement('div');
  el.className = 'fav-item';

  const nameSpan = document.createElement('span');
  nameSpan.className = 'fav-item-name';
  nameSpan.textContent = item.name;

  const pickerWrap = document.createElement('div');
  pickerWrap.className = 'cat-picker-wrap';
  const pickerBtn = document.createElement('button');
  pickerBtn.className = 'fav-tag-btn';
  pickerBtn.title = i('addToCat');
  pickerBtn.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>';
  pickerBtn.onclick = e => { e.stopPropagation(); openCatPicker(itemId, pickerBtn); };
  pickerWrap.appendChild(pickerBtn);

  const rmBtn = document.createElement('button');
  rmBtn.className = 'fav-remove';
  rmBtn.textContent = '✕';
  if (catId) {
    rmBtn.title = i('rmFromCat');
    rmBtn.onclick = e => { e.stopPropagation(); removeFromCategory(itemId, catId); renderPanel(); };
  } else {
    rmBtn.title = i('rmFav');
    rmBtn.onclick = e => { e.stopPropagation(); toggleFav(itemId); renderPanel(); };
  }

  el.appendChild(nameSpan);
  el.appendChild(pickerWrap);
  el.appendChild(rmBtn);
  el.onclick = () => { closePanel(); openModal(itemId); };
  return el;
}

function buildCatSection(cat, label, itemIds) {
  const valid = sortedItemIds(itemIds);
  const section = document.createElement('div');
  section.className = 'cat-section';

  const head = document.createElement('div');
  head.className = 'cat-section-head';

  const titleEl = document.createElement('span');
  titleEl.className = 'cat-title';
  titleEl.textContent = label;

  const countEl = document.createElement('span');
  countEl.className = 'cat-count';
  countEl.textContent = valid.length;

  const acts = document.createElement('div');
  acts.className = 'cat-actions';

  if (cat) {
    const renBtn = document.createElement('button');
    renBtn.className = 'cat-act';
    renBtn.title = i('renameCat');
    renBtn.textContent = '✏️';
    renBtn.onclick = e => {
      e.stopPropagation();
      const name = prompt(i('catPrompt'), cat.name);
      if (name && name.trim()) { cat.name = name.trim(); saveCats(); renderPanel(); }
    };
    acts.appendChild(renBtn);
  }

  const shareBtn = document.createElement('button');
  shareBtn.className = 'cat-act';
  shareBtn.title = i('shareCat');
  shareBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
  shareBtn.onclick = e => { e.stopPropagation(); copy(shareURL(valid, cat ? cat.name : null)); };
  acts.appendChild(shareBtn);

  if (cat) {
    const delBtn = document.createElement('button');
    delBtn.className = 'cat-act danger';
    delBtn.title = i('deleteCat');
    delBtn.textContent = '🗑';
    delBtn.onclick = e => {
      e.stopPropagation();
      if (confirm(i('deleteCatOk'))) { deleteCategory(cat.id); renderPanel(); }
    };
    acts.appendChild(delBtn);
  }

  head.appendChild(titleEl);
  head.appendChild(countEl);
  head.appendChild(acts);
  section.appendChild(head);

  if (valid.length) {
    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'cat-items';
    valid.forEach(itemId => {
      const el = buildFavItem(itemId, cat ? cat.id : null);
      if (el) itemsDiv.appendChild(el);
    });
    section.appendChild(itemsDiv);
  }

  return section;
}

function renderPanel() {
  const body = document.getElementById('panelBody');
  body.innerHTML = '';

  const newCatBtn = document.createElement('button');
  newCatBtn.className = 'panel-new-cat';
  newCatBtn.innerHTML = '<span style="font-size:1rem;font-weight:700;line-height:1">+</span> ' + i('newCat');
  newCatBtn.onclick = () => promptNewCategory();
  body.appendChild(newCatBtn);

  if (!S.favorites.size) {
    const empty = document.createElement('div');
    empty.className = 'state-box';
    empty.style.padding = '30px 0';
    empty.innerHTML = `<div class="icon">⭐</div><h3>${i('noFavs')}</h3><p>${i('noFavsHint')}</p>`;
    body.appendChild(empty);
    return;
  }

  const inCatSet = new Set(S.categories.flatMap(c => c.itemIds));
  const uncatItemIds = sortedItemIds([...S.favorites].filter(itemId => !inCatSet.has(itemId)));

  if (uncatItemIds.length) {
    body.appendChild(buildCatSection(null, i('uncategorized'), uncatItemIds));
  }

  S.categories.forEach(cat => {
    body.appendChild(buildCatSection(cat, cat.name, cat.itemIds));
  });
}

// ─── SHARED BANNER ───────────────────────────────────────────────────────────

function updateSharedBanner() {
  const el = document.getElementById('sharedBanner');
  if (!S.shared) { el.classList.remove('visible'); return; }
  el.classList.add('visible');
  let txt;
  if (S.sharedName) {
    txt = `${i('sharedCat')} ${S.sharedName} (${S.shared.length})`;
  } else {
    txt = S.shared.length === 1 ? i('sharedOne') : `${i('sharedMany')} (${S.shared.length})`;
  }
  document.getElementById('sharedBannerText').textContent = txt;
  document.getElementById('exitSharedLabel').textContent = i('exitShared');
}

// ─── LANGUAGE SWITCH ─────────────────────────────────────────────────────────

async function switchLang(lang) {
  lang = resolveLang(lang);
  if (lang === S.lang && S.data[lang]) return;
  clearSelection(false);
  S.lang = lang;
  saveLang();

  const u = new URL(location.href);
  u.searchParams.set('lang', lang);
  history.replaceState({}, '', u);

  applyI18N();
  updateSharedBanner();

  if (!S.data[lang]) {
    document.getElementById('main').innerHTML = `<div class="state-box">
      <div class="spinner"></div><p>${i('loading')}</p>
    </div>`;
    try { await loadLang(lang); }
    catch { document.getElementById('main').innerHTML = `<div class="state-box"><h3>${i('error')}</h3></div>`; return; }
  }

  if (S.shared) S.shared = refsToItemIds(S.shared, lang);
  normalizeStoredRefs(lang);
  syncActiveFilters();
  updateFavBadge();
  updateSharedBanner();
  S.page = 0;
  renderBlockTabs();
  renderTabs();
  renderCards();
  if (S.modal !== null) openModal(S.modal);
}

// ─── THEME ───────────────────────────────────────────────────────────────────

const THEME_KEY = 'metac_theme';
const THEMES    = ['auto', 'dark', 'light'];

const THEME_ICONS = {
  auto:  `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>`,
  dark:  `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
  light: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`,
};
const THEME_LABELS = { auto: 'Automático (sistema)', dark: 'Modo oscuro', light: 'Modo claro' };

function applyTheme(pref) {
  const isDark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme-pref', pref);
  const btn = document.getElementById('themeBtn');
  if (btn) { btn.innerHTML = THEME_ICONS[pref]; btn.title = THEME_LABELS[pref]; btn.setAttribute('aria-label', THEME_LABELS[pref]); }
}

applyTheme(localStorage.getItem(THEME_KEY) || 'auto');

matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if ((document.documentElement.getAttribute('data-theme-pref') || 'auto') === 'auto') applyTheme('auto');
});

// ─── INIT ────────────────────────────────────────────────────────────────────

async function init() {
  loadFavs();
  loadCats();
  updateFavBadge();
  loadLangPref();

  // Read URL params (override saved preference)
  const p = new URLSearchParams(location.search);
  const urlLang = p.get('lang');
  if (p.has('lang')) S.lang = resolveLang(urlLang);
  const t = p.get('t');
  if (t) S.shared = uniqueIds(t.split(','));
  const tname = p.get('tname');
  if (tname) S.sharedName = tname;

  applyI18N();
  updateSharedBanner();

  // Load data
  try { await loadLang(S.lang); }
  catch {
    document.getElementById('main').innerHTML = `<div class="state-box"><h3>${i('error')}</h3></div>`;
    return;
  }
  if (S.shared) S.shared = refsToItemIds(S.shared);
  syncActiveFilters();
  updateFavBadge();
  updateSharedBanner();

  renderBlockTabs();
  renderTabs();
  renderCards();

  // Auto-open modal for single shared methodological resource
  if (S.shared && S.shared.length === 1) openModal(S.shared[0]);

  // ── Event listeners ──────────────────────────────────────────────────────

  document.getElementById('searchInput').addEventListener('input', e => {
    S.search = e.target.value;
    S.page = 0;
    updateSearchUI();
    renderCards();
  });
  document.getElementById('searchClearBtn').onclick = () => {
    const input = document.getElementById('searchInput');
    input.value = '';
    S.search = '';
    S.page = 0;
    updateSearchUI();
    renderCards();
    input.focus();
  };

  document.getElementById('themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme-pref') || 'auto';
    const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    localStorage.setItem(THEME_KEY, next);
    applyTheme(next);
  });

  document.querySelectorAll('.lang-btn').forEach(b => b.onclick = () => switchLang(b.dataset.lang));

  document.getElementById('selectBtn').onclick = toggleSelectMode;
  document.getElementById('favBtn').onclick = openPanel;
  document.getElementById('panelClose').onclick = closePanel;
  document.getElementById('panelOverlay').onclick = e => { if (e.target === e.currentTarget) closePanel(); };

  document.getElementById('modalCloseBtn').onclick = closeModal;
  document.getElementById('modalCloseBtnFooter').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = e => { if (e.target === e.currentTarget) closeModal(); };

  document.getElementById('modalFavBtn').onclick = e => { if (S.modal !== null) toggleFav(S.modal, e.currentTarget); };
  document.getElementById('modalShareBtn').onclick = () => { if (S.modal !== null) copy(shareURL([S.modal])); };

  document.getElementById('clearFavsBtn').onclick = () => {
    if (!confirm(i('clearConfirm'))) return;
    S.favorites.clear(); S.categories = []; saveFavs(); saveCats(); updateFavBadge(); renderCards(); renderPanel();
  };

  document.getElementById('exitSharedBtn').onclick = () => {
    clearSelection(false);
    S.shared = null;
    S.page = 0;
    const u = new URL(location.href);
    u.searchParams.delete('t');
    u.searchParams.delete('tname');
    history.replaceState({}, '', u);
    updateSharedBanner();
    applyI18N();
    renderCards();
  };

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (document.getElementById('modalOverlay').classList.contains('open')) closeModal();
    else if (document.getElementById('panelOverlay').classList.contains('open')) closePanel();
    else if (S.selectMode) clearSelection();
  });
}

init();
</script>

<script>
(function () {
  const ANALYTICS_FALLBACK_ENDPOINT = 'https://bilateria.org/app/estadistica/metac/track.php';
  const ANALYTICS_FALLBACK_SITE_ID = 'metac';
  const ANALYTICS_COOLDOWN_MS = 30 * 60 * 1000;
  const ANALYTICS_TIMEOUT_MS = 4000;

  function getMetaContent(name) {
    const node = document.querySelector(`meta[name="${name}"]`);
    return node ? String(node.getAttribute('content') || '').trim() : '';
  }

  function getAnalyticsConfig() {
    return {
      endpoint: getMetaContent('analytics-endpoint') || ANALYTICS_FALLBACK_ENDPOINT,
      siteId: getMetaContent('analytics-site-id') || ANALYTICS_FALLBACK_SITE_ID
    };
  }

  function shouldTrackAnalytics() {
    const protocol = String(window.location.protocol || '');
    const hostname = String(window.location.hostname || '').toLowerCase();
    if (protocol !== 'http:' && protocol !== 'https:') return false;
    if (hostname === 'localhost' || hostname === '127.0.0.1' || hostname === '::1') return false;
    return !hostname.endsWith('.local');
  }

  function getStorageKey(siteId) {
    return `analytics:last-visit:${siteId}`;
  }

  function shouldCountVisit(siteId) {
    try {
      const lastVisit = Number.parseInt(window.localStorage.getItem(getStorageKey(siteId)) || '', 10);
      return !Number.isFinite(lastVisit) || (Date.now() - lastVisit) > ANALYTICS_COOLDOWN_MS;
    } catch (error) {
      return true;
    }
  }

  function rememberVisit(siteId) {
    try {
      window.localStorage.setItem(getStorageKey(siteId), String(Date.now()));
    } catch (error) {
      // Analytics must never affect the public app.
    }
  }

  function requestAnalytics() {
    if (!shouldTrackAnalytics()) return;

    const config = getAnalyticsConfig();
    if (!config.endpoint) return;

    const countVisit = shouldCountVisit(config.siteId);
    const callbackName = `__metacAnalytics_${Date.now().toString(36)}_${Math.random().toString(36).slice(2)}`;
    const pageParams = new URLSearchParams(window.location.search || '');
    const query = new URLSearchParams();
    const script = document.createElement('script');
    let settled = false;
    let timeoutId = 0;

    function cleanup() {
      if (settled) return;
      settled = true;
      if (timeoutId) window.clearTimeout(timeoutId);
      try {
        delete window[callbackName];
      } catch (error) {
        window[callbackName] = undefined;
      }
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    query.set('site', config.siteId);
    query.set('callback', callbackName);
    query.set('page_url', window.location.href);
    query.set('referrer', document.referrer || '');
    if (!countVisit) query.set('summary_only', '1');

    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'].forEach(key => {
      const value = String(pageParams.get(key) || '').trim();
      if (value) query.set(key, value);
    });

    window[callbackName] = function (payload) {
      try {
        if (countVisit && payload && payload.ok) rememberVisit(config.siteId);
      } finally {
        cleanup();
      }
    };

    script.async = true;
    script.src = `${config.endpoint}${config.endpoint.includes('?') ? '&' : '?'}${query.toString()}`;
    script.onerror = cleanup;
    timeoutId = window.setTimeout(cleanup, ANALYTICS_TIMEOUT_MS);
    document.head.appendChild(script);
  }

  function initAnalytics() {
    const run = function () {
      try {
        window.setTimeout(requestAnalytics, 0);
      } catch (error) {
        // Silent failure by design.
      }
    };

    if (typeof window.requestIdleCallback === 'function') {
      window.requestIdleCallback(run, { timeout: 2500 });
      return;
    }
    if (document.readyState === 'complete') {
      run();
      return;
    }
    window.addEventListener('load', run, { once: true });
  }

  initAnalytics();
})();
</script>
